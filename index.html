<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaitLess</title>
  
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #map {
  width: 100%;
  height: 350px;
  border-radius: 12px;
  margin-top: 20px;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
}
header{
  background:#111827;
  color:white;
  padding:28px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

main{
  max-width:650px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#10b981;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#059669;
}

.report{
  border-bottom:1px solid #eee;
  padding:14px 0;
}

.report:last-child{
  border-bottom:0;
}

.wait{
  font-size:22px;
  font-weight:bold;
  color:#059669;
}

.status{
  text-align:center;
  color:#6b7280;
}

footer{
  text-align:center;
  padding:20px;
  color:#6b7280;
}
</style>
</head>

<body>

<header>
  <h1>⏱ WaitLess</h1>
  <p>Moins d'attente. Plus de temps pour vous.</p>
</header>

<main>

<div class="card">
  <h2>Signaler une attente</h2>

  <input
    id="placeName"
    type="text"
    placeholder="Nom du lieu"
  >

  <button type="button" onclick="getLocation()">
  📍 Utiliser ma position
</button>
  
  <input
    id="waitMinutes"
    type="number"
    min="0"
    placeholder="Temps d'attente en minutes"
  >

  <button onclick="sendReport()">
    Publier le temps d'attente
  </button>

  <p id="message" class="status"></p>
</div>

<div class="card">
  <h2>Temps d'attente récents</h2>

  <div id="reports">
    <p class="status">Chargement...</p>
  </div>
</div>

<div class="card">
  <h2>🗺️ Carte des temps d'attente</h2>
  <div id="map"></div>
</div>

</main>

<footer>
  WaitLess • Temps d'attente partagés en temps réel
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ropvmaqgtfjsrnipyvth.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fvPrFKonEXySg93KfxuoFQ_BVjUjCER";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  function getLocation() {
  if (!navigator.geolocation) {
    alert("La géolocalisation n'est pas disponible sur cet appareil.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      window.userLatitude = position.coords.latitude;
      window.userLongitude = position.coords.longitude;

      document.getElementById("placeName").value = "Ma position";
      alert("📍 Position récupérée !");
    },
    function() {
      alert("Impossible de récupérer votre position.");
    }
  );
}
// AJOUTER UN SIGNALEMENT

async function sendReport(){

  const placeName =
    document.getElementById("placeName")
    .value.trim();

  const waitMinutes =
    parseInt(
      document.getElementById("waitMinutes").value
    );

  const message =
    document.getElementById("message");

  if(
    !placeName ||
    Number.isNaN(waitMinutes) ||
    waitMinutes < 0
  ){
    message.textContent =
      "Indique le lieu et un temps d'attente valide.";
    return;
  }

  message.textContent = "Publication...";

  const placeId =
    placeName
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-|-$/g,"");

  const { error } =
    await supabaseClient
      .from("wait_report")
.insert({
  place_id: placeId,
  place_name: placeName,
  wait_minutes: waitMinutes,
  latitude: window.userLatitude || null,
  longitude: window.userLongitude || null
});
if (error) {
    console.error("Erreur Supabase :", error);
    message.textContent = "Erreur : " + error.message;
    return;
}
  message.textContent =
    "✓ Temps d'attente publié !";

  document.getElementById("placeName").value="";
  document.getElementById("waitMinutes").value="";

  loadReports();
}


// CHARGER LES SIGNALEMENTS

function distanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.asin(Math.sqrt(a));
}

async function loadReports(){

  const container =
    document.getElementById("reports");

  const { data, error } =
    await supabaseClient
      .from("wait_report")
  .select(
      "id,created_at,place_name,wait_minutes,latitude,longitude"
      )
      .order("created_at",{
        ascending:false
      })
      .limit(20);

  if(error){
    console.error(error);
    container.innerHTML =
      '<p class="status">Impossible de charger les données.</p>';
    return;
  }

  if(!data || data.length===0){
    container.innerHTML =
      '<p class="status">Aucun signalement pour le moment.</p>';
    return;
  }

  container.innerHTML="";

  data.forEach(report=>{
    if (
  Number.isFinite(window.userLatitude) &&
  Number.isFinite(window.userLongitude)
) {
  if (report.latitude == null || report.longitude == null) return;

  const distance = distanceKm(
    window.userLatitude,
    window.userLongitude,
    Number(report.latitude),
    Number(report.longitude)
  );

  if (!Number.isFinite(distance) || distance > 5) return;
}

const distanceTexte =
  Number.isFinite(window.userLatitude) &&
  Number.isFinite(window.userLongitude) &&
  report.latitude != null &&
  report.longitude != null
    ? distanceKm(
        window.userLatitude,
        window.userLongitude,
        Number(report.latitude),
        Number(report.longitude)
      ).toFixed(1) + " km"
    : "";

    const item =
      document.createElement("div");

    item.className="report";

    const name =
      document.createElement("strong");

    name.textContent =
      report.place_name || "Lieu";

    const wait =
      document.createElement("div");

    wait.className="wait";
    wait.textContent =
      report.wait_minutes + " min";

    const date =
      document.createElement("small");

    date.textContent =
      new Date(report.created_at)
      .toLocaleString("fr-FR");

    item.appendChild(name);
    item.appendChild(wait);
    item.appendChild(date);

    
if (distanceTexte) {
  const distanceElement = document.createElement("div");
  distanceElement.textContent = "📍 À " + distanceTexte;
  item.appendChild(distanceElement);
}


    container.appendChild(item);
  });
}


// ACTUALISATION TEMPS RÉEL

supabaseClient
.channel("waitless-live")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"wait_report"
  },
  
() => {
  loadReports();
  loadMapMarkers();
}

)
.subscribe();

loadReports();

const map = L.map("map").setView([46.603354, 1.888334], 6);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = L.layerGroup().addTo(map);

async function loadMapMarkers() {
  const { data, error } = await supabaseClient
    .from("wait_report")
    .select("place_name,wait_minutes,latitude,longitude");

  if (error) {
    console.error(error);
    return;
  }

  markers.clearLayers();

  (data || []).forEach(report => {
    if (report.latitude == null || report.longitude == null) return;

    const lat = Number(report.latitude);
    const lon = Number(report.longitude);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

    const popup = document.createElement("div");
    const name = document.createElement("strong");
    name.textContent = report.place_name || "Lieu";
    const wait = document.createElement("p");
    wait.textContent = `${report.wait_minutes} min d'attente`;
    popup.append(name, wait);

    L.marker([lat, lon])
  .addTo(markers)
  .bindPopup(popup)
  .openPopup();
  });
}

loadMapMarkers();

</script>

</body>
</html>
